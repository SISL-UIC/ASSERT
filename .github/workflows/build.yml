name: Build
permissions:
  contents: read
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --upgrade build twine
    - run: python -m build
    - run: python -m twine check dist/*
    - name: Upload dist (PR build, short retention)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 14
        if-no-files-found: error
    - name: Upload dist (main / dispatch, long retention)
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 90
        if-no-files-found: error
    timeout-minutes: 6
  test-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.11'
    runs-on: self-hosted
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/checkout@v4
      with:
        path: source
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - run: pip install $(ls dist/*.whl) pytest
      shell: bash
    - run: assert-ai --help
    - name: Test installed wheel
      run: pytest source/tests/test_import_smoke.py source/tests/test_library_loader.py
        -v --import-mode=importlib
      shell: bash
    timeout-minutes: 6
    if: ${{ !cancelled() }}
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - main
    paths:
    - assert_ai/**
    - tests/**
    - pyproject.toml
    - uv.lock
    - pytest.ini
    - README.md
    - LICENSE
    - .github/workflows/build.yml
  pull_request:
    branches:
    - main
    paths:
    - assert_ai/**
    - tests/**
    - pyproject.toml
    - uv.lock
    - pytest.ini
    - README.md
    - LICENSE
    - .github/workflows/build.yml
  workflow_dispatch: null
