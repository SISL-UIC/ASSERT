# Reviewed, committed ACS manifest for the budget-overrun failure.
#
# Enforces the deterministic pre_tool_call numeric-threshold gate in
# ./policy/travel_budget_overrun.rego on the two search tools. Both pre_tool_call
# and post_tool_call are declared so a guarded tool does not fail closed to deny.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: travel_budget_overrun
extends: []
policies:
  travel_budget_overrun:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.travel_budget_overrun.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: travel_budget_overrun
      query: data.agent_control_specification.travel_budget_overrun.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    policy:
      id: travel_budget_overrun
      query: data.agent_control_specification.travel_budget_overrun.post_tool_call_verdict
    tool_name_from: $.tool_call.name
tools:
  search_flights:
    type: Tool
    id: search_flights
  search_hotels:
    type: Tool
    id: search_hotels
