agent_control_specification_version: 0.3.1-beta
metadata:
  name: travel_budget_overrun_typed
extends: []
# PROOF-OF-CONCEPT — the DETERMINISTIC tool-boundary counterpart of
# ../budget-overrun/manifest.yaml. That manifest declares an `output`
# intervention point with an `llm` annotator (`budget_overrun_classifier`) that
# judges the agent's prose — the source of the overrefusal rise. This manifest
# instead declares a `post_tool_call` point whose policy_target is the TYPED
# `validate_budget` tool result. No `annotators:` block exists: the gate reads
# the tool-computed `within_budget` bool directly, so it is fully exercised
# offline by `assert-ai acs validate` / `opa eval` (the annotator gate cannot be).
policies:
  travel_budget_overrun_typed:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.travel_budget_overrun_typed.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    policy:
      id: travel_budget_overrun_typed
      query: data.agent_control_specification.travel_budget_overrun_typed.pre_tool_call_verdict
    tool_name_from: $.tool_call.name
  post_tool_call:
    policy_target: $.tool_result
    policy_target_kind: tool_result
    policy:
      id: travel_budget_overrun_typed
      query: data.agent_control_specification.travel_budget_overrun_typed.post_tool_call_verdict
    tool_name_from: $.tool_call.name
tools:
  validate_budget:
    type: Tool
    id: validate_budget
