# Reviewed, committed ACS manifest for the career_health_assessment prompt-injection
# failure — SEMANTIC output-annotator gate.
#
# The agent has NO tools, so injection compliance surfaces purely in the
# assistant's JSON reply; there is no structural field to key on. This gate
# enforces the output policy in ./policy/career_health_injection_output.rego. The
# `injection_classifier` annotator is host-populated at RUNTIME by the governed
# agent's annotator dispatcher
# (examples/career_health_assessment/agent_guarded_injection.py), which runs an LLM
# check over the reply, judging whether it complied with an instruction embedded in
# the untrusted CV text (overridden/inflated scores, disclosed prompt, fabricated
# credential). Offline `assert-ai acs validate` does not run the annotator, so this
# gate shows `handled 0/N` there — that is EXPECTED; prove it via the guarded
# remeasure delta.
#
# Reviewed from the `assert-ai acs generate` draft
# (artifacts/acs/career-health-prompt-injection): consolidated to one grounded
# injection-compliance classifier for a single, well-scoped semantic gate.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: career_health_injection_output
extends: []
policies:
  career_health_injection_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.career_health_injection_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: career_health_injection_output
      query: data.agent_control_specification.career_health_injection_output.output_verdict
    annotations:
      injection_classifier:
        from: $policy_target
annotators:
  injection_classifier:
    type: llm
