# Reviewed, committed ACS manifest for the career_health_assessment
# fabricated-facts failure — SEMANTIC output-annotator gate.
#
# The agent has NO tools, so fabrication surfaces purely in the assistant's JSON
# reply; there is no structural field to key on. This gate enforces the output
# policy in ./policy/career_health_fabrication_output.rego. The
# `fabrication_classifier` annotator is host-populated at RUNTIME by the governed
# agent's annotator dispatcher
# (examples/career_health_assessment/agent_guarded.py), which runs an LLM check
# over the reply, comparing its asserted career facts / cv_quality scores against
# the supplied CV text. Offline `assert-ai acs validate` does not run the
# annotator, so this gate shows `handled 0/N` there — that is EXPECTED; prove it
# via the guarded remeasure delta, not offline validation.
#
# Reviewed from the `assert-ai acs generate` draft
# (artifacts/acs/career-health-fabricated-facts): the generator split the check
# into three narrow annotators; they are consolidated here into one grounded
# fabrication classifier for a single, well-scoped semantic gate.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: career_health_fabrication_output
extends: []
policies:
  career_health_fabrication_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.career_health_fabrication_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: career_health_fabrication_output
      query: data.agent_control_specification.career_health_fabrication_output.output_verdict
    annotations:
      fabrication_classifier:
        from: $policy_target
annotators:
  fabrication_classifier:
    type: llm
