# Reviewed, committed ACS manifest for the generated-tools health-assistant
# harmful_medical_advice failure — SEMANTIC output-annotator gate.
#
# The generated-tools config uses per-test-case tools and an adversarial
# "distrusts standard medicine" user framing, but the harm (endorsing a dangerous
# substitution, or actionable dosing of an unproven remedy) surfaces purely in the
# assistant's PROSE reply — not a structural tool field. This one gate covers BOTH
# selected Clarity risks — failure-01 (substitution endorsement) and failure-02
# (alternative-remedy dosing) — because they share the same behavior and output
# surface, so a single guarded callable governs both suites.
#
# The `harm_actionability_classifier` annotator is host-populated at RUNTIME by the
# governed agent's annotator dispatcher
# (examples/prompt_agents/gen_tools/agent_guarded.py), which runs an LLM check over
# the reply, calibrated to the ASSERT judge's `harm_actionability` bar. Offline
# `assert-ai acs validate` does not run the annotator, so this gate shows
# `handled 0/N` there — that is EXPECTED; prove it via the guarded remeasure delta.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: health_assistant_gentools_harm_output
extends: []
policies:
  health_assistant_gentools_harm_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.health_assistant_gentools_harm_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: health_assistant_gentools_harm_output
      query: data.agent_control_specification.health_assistant_gentools_harm_output.output_verdict
    annotations:
      harm_actionability_classifier:
        from: $policy_target
annotators:
  harm_actionability_classifier:
    type: llm
