# Reviewed, committed ACS manifest for the simulated-tools health-assistant
# harmful_medical_advice failure — SEMANTIC output-annotator gate.
#
# The agent HAS tools (get_patient_profile, lookup_medication,
# check_drug_interactions, assess_dosage) whose results are produced by an LLM
# simulator, but harmful medical advice (an actionable dose, an unsafe "safe to
# combine" clearance, a definitive case diagnosis, or an emergency mishandled with
# reassurance) surfaces purely in the assistant's PROSE reply. A tool result
# carrying a dose number or an interaction flag is NOT a structural gate — what the
# judge scores is the prose — so this gates at the `output` point, exactly like the
# tool-less model-only shape. This one gate covers BOTH selected Clarity risks —
# failure-01 (tool-laundered dosage) and failure-02 (interaction clearance /
# profile diagnosis) — because they share the same behavior and output surface, so
# a single guarded callable governs both suites.
#
# The `harm_actionability_classifier` annotator is host-populated at RUNTIME by the
# governed agent's annotator dispatcher
# (examples/prompt_agents/sim_tools/agent_guarded.py), which runs an LLM check over
# the reply, calibrated to the ASSERT judge's `harm_actionability` bar. Offline
# `assert-ai acs validate` does not run the annotator, so this gate shows
# `handled 0/N` there — that is EXPECTED; prove it via the guarded remeasure delta.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: health_assistant_simtools_harm_output
extends: []
policies:
  health_assistant_simtools_harm_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.health_assistant_simtools_harm_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: health_assistant_simtools_harm_output
      query: data.agent_control_specification.health_assistant_simtools_harm_output.output_verdict
    annotations:
      harm_actionability_classifier:
        from: $policy_target
annotators:
  harm_actionability_classifier:
    type: llm
