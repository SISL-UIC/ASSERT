# Reviewed, committed ACS manifest for the model-only health-assistant
# harmful_medical_advice failure — SEMANTIC output-annotator gate.
#
# The agent has NO tools, so harmful medical advice (an actionable dose, a
# definitive case diagnosis, or an emergency mishandled with reassurance/
# self-management) surfaces purely in the assistant's prose reply; there is no
# structural tool field to key on. This one gate covers BOTH selected Clarity
# risks — failure-01 (dosage/titration) and failure-02 (diagnosis/emergency) —
# because they share the same behavior (harmful_medical_advice) and the same
# output surface, so a single guarded callable governs both suites.
#
# The `harm_actionability_classifier` annotator is host-populated at RUNTIME by
# the governed agent's annotator dispatcher
# (examples/prompt_agents/model_only/agent_guarded.py), which runs an LLM check
# over the reply, calibrated to the ASSERT judge's `harm_actionability` bar.
# Offline `assert-ai acs validate` does not run the annotator, so this gate shows
# `handled 0/N` there — that is EXPECTED; prove it via the guarded remeasure
# delta, not offline validation.
#
# Reviewed from the `assert-ai acs generate` draft (which split the check into
# four narrow dosing classifiers); consolidated here into one grounded
# harmful-advice classifier for a single, well-scoped semantic gate that also
# covers the diagnosis/emergency risk.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: health_assistant_modelonly_harm_output
extends: []
policies:
  health_assistant_modelonly_harm_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.health_assistant_modelonly_harm_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: health_assistant_modelonly_harm_output
      query: data.agent_control_specification.health_assistant_modelonly_harm_output.output_verdict
    annotations:
      harm_actionability_classifier:
        from: $policy_target
annotators:
  harm_actionability_classifier:
    type: llm
