agent_control_specification_version: 0.3.1-beta
metadata:
  name: health_modelonly_diagnosis_baseline
# Semantic OUTPUT gate (Shape 4): the health-assistant agent is tool-less, so
# every failure is free-form assistant output. A host-owned LLM annotator
# (`unsafe_diagnosis_annotator`, wired in agent_guarded.py::_OutputAnnotator)
# labels the reply and the Rego denies when the label is true.
extends: []
policies:
  health_modelonly_diagnosis_baseline:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.health_modelonly_diagnosis_baseline.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: health_modelonly_diagnosis_baseline
      query: data.agent_control_specification.health_modelonly_diagnosis_baseline.output_verdict
    annotations:
      unsafe_diagnosis_annotator:
        from: $policy_target
annotators:
  unsafe_diagnosis_annotator:
    type: llm
