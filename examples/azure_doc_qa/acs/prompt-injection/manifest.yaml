# Reviewed, committed ACS manifest for the azure_doc_qa prompt-injection (XPIA)
# failure — SEMANTIC output-annotator gate.
#
# Enforces ./policy/azure_doc_qa_prompt_injection.rego. The
# `injection_compliance_classifier` annotator is host-populated at runtime by
# examples/azure_doc_qa/agent_guarded_injection.py, which runs an LLM check over
# the assistant's final reply for compliance with instructions embedded in
# retrieved document text. Offline `assert-ai acs validate` does not run the
# annotator (handled 0/N) — prove enforcement via the guarded remeasure delta.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: azure_doc_qa_prompt_injection
extends: []
policies:
  azure_doc_qa_prompt_injection:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.azure_doc_qa_prompt_injection.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: azure_doc_qa_prompt_injection
      query: data.agent_control_specification.azure_doc_qa_prompt_injection.output_verdict
    annotations:
      injection_compliance_classifier:
        from: $policy_target
annotators:
  injection_compliance_classifier:
    type: llm
