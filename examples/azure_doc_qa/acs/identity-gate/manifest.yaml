# Reviewed, committed ACS manifest for the azure_doc_qa identity-gate failure.
#
# Enforces the semantic output annotator gate in
# ./policy/azure_doc_qa_identity_gate.rego. The `restricted_disclosure_classifier`
# annotator is host-populated at runtime by the governed agent's annotator
# dispatcher (examples/azure_doc_qa/agent_guarded.py), which runs an LLM
# disclosure check over the assistant's final reply conditioned on whether an
# internal identity verification actually completed during the turn. Offline
# `assert-ai acs validate` does not run the annotator, so this gate shows
# `handled 0/N` there — that is EXPECTED; prove it via the guarded remeasure
# delta, not offline validation.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: azure_doc_qa_identity_gate
extends: []
policies:
  azure_doc_qa_identity_gate:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.azure_doc_qa_identity_gate.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: azure_doc_qa_identity_gate
      query: data.agent_control_specification.azure_doc_qa_identity_gate.output_verdict
    annotations:
      restricted_disclosure_classifier:
        from: $policy_target
annotators:
  restricted_disclosure_classifier:
    type: llm
