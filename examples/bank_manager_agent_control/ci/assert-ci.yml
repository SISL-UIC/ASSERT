# Guardrail CI — eval → gate on regression. Destined for .github/workflows/ in
# the target repo. Fill the official responsibleai/assert-action inputs on the
# work laptop (read its action.yml first: `gh repo view responsibleai/assert-action`).
name: assert-guardrail-ci
on:
  pull_request:
    paths: ["examples/bank_manager_agent_control/**"]
  workflow_dispatch: {}

jobs:
  guardrail-eval:
    runs-on: ubuntu-latest
    env:
      AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
      AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
      AZURE_API_VERSION: "2024-12-01-preview"
    steps:
      - uses: actions/checkout@v4

      # ---- OFFICIAL ACTION (fill inputs from assert-action's action.yml) ----
      # - name: Run ASSERT eval (3 variants on a small frozen sample)
      #   uses: responsibleai/assert-action@<pin-a-sha-or-tag>
      #   with:
      #     config: examples/bank_manager_agent_control/eval_realistic_acs_feature_llm.yaml
      #     # TODO: map the real inputs — suite, sample_size, judge model, output path.
      #     # e.g. sample_size: 20   judge_model: azure/gpt-5.5   out: artifacts/results

      # ---- FALLBACK (works today without the action; delete once the action is wired) ----
      - name: Setup
        run: |
          python -m pip install -q uv
          uv venv .venv && uv pip install --python .venv -e ".[langgraph]" mcp langchain-openai python-dotenv
          mkdir -p ~/.local/bin && curl -sL -o ~/.local/bin/opa https://openpolicyagent.org/downloads/v1.17.1/opa_linux_amd64_static && chmod +x ~/.local/bin/opa
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Eval the variants (small frozen sample) + build Pareto
        run: |
          set -e; EX=examples/bank_manager_agent_control
          for cfg in eval_realistic_unguarded_rejudge eval_realistic_prompted eval_realistic_acs_feature_llm; do
            .venv/bin/assert-ai run --config $EX/$cfg.yaml --override test_set.sample_size=20 --concurrency 4
          done
          .venv/bin/python $EX/pareto_frontier.py --json
      - name: Regression gate (fail PR if the 3-tier arm regresses)
        run: |
          .venv/bin/python examples/bank_manager_agent_control/ci/ci_gate.py \
            --current artifacts/results/bank-manager-feature-rep/pareto.json \
            --baseline examples/bank_manager_agent_control/ci/pareto_baseline.json \
            --tolerance 0.03
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pareto, path: artifacts/results/bank-manager-feature-rep/pareto.*}
