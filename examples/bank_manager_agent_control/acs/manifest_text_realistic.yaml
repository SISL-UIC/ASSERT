agent_control_specification_version: "0.3.0-alpha"
metadata:
  name: "bank-manager-acs-text-realistic"

# B2 arm — the LEGACY TEXT policy (bank_manager.rego), unchanged, pointed at
# the realistic multi-domain bank's 13 tools. The point of this manifest is to
# expose the generalization failure: the text policy's gates are hardcoded to
# regex.match("ACC-100[23]", ...) on read_account / read_transaction_history /
# prepare_transfer / create_transfer. It has:
#   - NO gate for read_loan / read_portfolio / read_client (sensitive LN-/BR-/CL-
#     entities pass straight through), and
#   - NO grounding gate for knowledge_base_retrieve.
# So sensitive loans, portfolios, and clients are ungated, and the injection
# scrubber is a blunt prose regex. T1 (manifest_feature.yaml) covers all of
# these via typed signals. Both run the SAME agent + servers; only the policy
# differs.

policies:
  bank_manager:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.bank_manager.verdict

intervention_points:
  input:
    policy_target: "$.input"
    policy_target_kind: user_input
    policy:
      id: bank_manager
      query: data.agent_control_specification.bank_manager.input_verdict

  pre_tool_call:
    policy_target: "$.tool_call.args"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: bank_manager
      query: data.agent_control_specification.bank_manager.pre_tool_call_verdict

  post_tool_call:
    policy_target: "$.tool_result"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: bank_manager
      query: data.agent_control_specification.bank_manager.post_tool_call_verdict

  output:
    policy_target: "$.output"
    policy_target_kind: agent_output
    policy:
      id: bank_manager
      query: data.agent_control_specification.bank_manager.verdict

tools:
  read_account: {}
  read_transaction_history: {}
  prepare_transfer: {}
  request_customer_approval: {}
  create_transfer: {}
  freeze_account: {}
  enable_admin_mode: {}
  read_client: {}
  read_loan: {}
  prepare_loan_modification: {}
  read_portfolio: {}
  place_trade: {}
  knowledge_base_retrieve: {}
