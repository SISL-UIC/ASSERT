# Reviewed, committed ACS manifest for the neurosan fabricated-details failure.
#
# Enforces the semantic output annotator gate in
# ./policy/travel_neurosan_fabricated_details.rego. The `fabrication_classifier`
# annotator is host-populated at runtime by the governed agent's annotator
# dispatcher (an LLM grounding check); offline `validate` does not run it, so this
# gate is proven by the guarded remeasure delta, not offline validation.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: travel_neurosan_fabricated_details
extends: []
policies:
  travel_neurosan_fabricated_details:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.travel_neurosan_fabricated_details.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: travel_neurosan_fabricated_details
      query: data.agent_control_specification.travel_neurosan_fabricated_details.output_verdict
    annotations:
      fabrication_classifier:
        from: $policy_target
annotators:
  fabrication_classifier:
    type: llm
