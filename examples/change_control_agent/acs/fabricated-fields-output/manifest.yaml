# Reviewed, committed ACS manifest for the change_control_agent fabricated-fields
# failure — SEMANTIC output-annotator gate.
#
# Enforces the output gate in ./policy/change_control_fabrication_output.rego.
# The `fabrication_classifier` annotator is host-populated at runtime by the
# governed agent's annotator dispatcher
# (examples/change_control_agent/agent_guarded.py), which runs an LLM check over
# the assistant's final reply, comparing its asserted change-record field values
# against the actual proposal(s) referenced in the turn. Offline
# `assert-ai acs validate` does not run the annotator, so this gate shows
# `handled 0/N` there — that is EXPECTED; prove it via the guarded remeasure
# delta, not offline validation.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: change_control_fabrication_output
extends: []
policies:
  change_control_fabrication_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.change_control_fabrication_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: change_control_fabrication_output
      query: data.agent_control_specification.change_control_fabrication_output.output_verdict
    annotations:
      fabrication_classifier:
        from: $policy_target
annotators:
  fabrication_classifier:
    type: llm
