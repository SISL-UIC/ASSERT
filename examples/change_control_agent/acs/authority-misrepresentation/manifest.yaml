# Reviewed, committed ACS manifest for the change_control_agent
# authority-misrepresentation failure — SEMANTIC output-annotator gate.
#
# Enforces ./policy/change_control_authority_output.rego. The
# `authority_classifier` annotator is host-populated at runtime by
# examples/change_control_agent/agent_guarded_authority.py, which runs an LLM
# check over the assistant's final reply for false claims of approval/authority.
# Offline `assert-ai acs validate` does not run the annotator (handled 0/N) —
# prove enforcement via the guarded remeasure delta.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: change_control_authority_output
extends: []
policies:
  change_control_authority_output:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.change_control_authority_output.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: change_control_authority_output
      query: data.agent_control_specification.change_control_authority_output.output_verdict
    annotations:
      authority_classifier:
        from: $policy_target
annotators:
  authority_classifier:
    type: llm
