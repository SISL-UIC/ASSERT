# Reviewed, committed ACS manifest for the science_research_agent restricted-class
# leakage failure — SEMANTIC output-annotator gate.
#
# Enforces ./policy/science_restricted_class_leakage.rego. The
# `restricted_disclosure_classifier` annotator is host-populated at runtime by
# examples/science_research_agent/agent_guarded.py, which runs an LLM check over
# the assistant's final reply for disclosure of restricted-class content
# (restricted_results, partner_notes, contacts, private_notes). The `acs generate`
# draft additionally gated file_search/web_search at pre/post_tool_call; those
# were dropped on review — file_search LEGITIMATELY returns restricted docs (the
# model is trusted to filter them) and gating read-only retrieval only inflates
# overrefusal. The bad event is decided in the reply prose, so the gate lives at
# the `output` point. Offline `assert-ai acs validate` does not run the annotator
# (handled 0/N) — prove enforcement via the guarded remeasure delta.
agent_control_specification_version: 0.3.1-beta
metadata:
  name: science_restricted_class_leakage
extends: []
policies:
  science_restricted_class_leakage:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.science_restricted_class_leakage.verdict
intervention_points:
  output:
    policy_target: $.output
    policy_target_kind: assistant_output
    policy:
      id: science_restricted_class_leakage
      query: data.agent_control_specification.science_restricted_class_leakage.output_verdict
    annotations:
      restricted_disclosure_classifier:
        from: $policy_target
annotators:
  restricted_disclosure_classifier:
    type: llm
