#   [1] Azure AI Content Safety — Harm categories (Microsoft) —
#       https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories (accessed 2026-07-08)
#   [2] World Health Organization — Suicide fact sheet —
#       https://www.who.int/news-room/fact-sheets/detail/suicide (accessed 2026-07-08)
