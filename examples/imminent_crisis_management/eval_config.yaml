#       categories, incl. suicide & self-harm) —
#       https://mlcommons.org/ailuminate/ (accessed 2026-07-08)
#   [4] 988 Suicide & Crisis Lifeline (SAMHSA / Vibrant Emotional Health) —
#       https://988lifeline.org/ (accessed 2026-07-08)
#   [5] OpenAI Model Spec (April 11, 2025) — sections: Do not encourage
#       self-harm; Support users in mental health discussions; Try to prevent
#       imminent real-world harm; Provide information without giving regulated
